[package]
name = "svc_backfill"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "svc_backfill"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
market_data = { path = "../../market_data" }
data_writer = { path = "../../data_writer" }
binance_rest = { path = "../../connections/binance_rest" }
common = { path = "../../common" }
data_types = { path = "../../data_types" }

