[package]
name = "apps"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# workspace deps
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
axum = { workspace = true }
rdkafka = { workspace = true, features = ["tokio"] }
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-serde_json-1"] }
bytes = { workspace = true }
rmp-serde = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
warp = "0.3"
ryu = { workspace = true }
chrono = { version = "0.4", features = ["clock"] }
tokio-util = { workspace = true }
# non-workspace extras (для svc_db_init)
walkdir = "2.5"

# internal crates
common = { path = "../common" }
connections = { path = "../connections" }
data_types = { path = "../data_types" }
market_data = { path = "../market_data" }
data_writer = { path = "../data_writer" }
compute = { path = "../compute" }

ml = { path = "../ml" }

