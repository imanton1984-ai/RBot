# ═══════════════════════════════════════════════════════════════════════════
# GLOBAL TP/SL PARAMETERS FOR TRADE SIGNALS
# ═══════════════════════════════════════════════════════════════════════════
#
# 📊 КАЛИБРОВКА ПАРАМЕТРОВ:
# 1. Измени значения ниже
# 2. Запусти backtester: cargo run --package backtester
# 3. Сравни результаты (WinRate, AvgPnL, Sharpe)
# 4. Повторяй пока не найдёшь оптимум
#
# 📝 ВСЕ ЗНАЧЕНИЯ В ПРОЦЕНТАХ:
#    tp1_pct = 0.3  →  TP1 = entry + 0.3%
#    sl_pct  = 0.4  →  SL  = entry - 0.4%
#
# ───────────────────────────────────────────────────────────────────────────
# ТЕКУЩИЕ РЕЗУЛЬТАТЫ БЕКТЕСТА (до калибровки):
# ───────────────────────────────────────────────────────────────────────────
# TF      Total   Wins   Loss    Exprd  WinRate   AvgPnL     Sharpe
# 1m       1754    908    805       41    51.8%  -0.0410%    -0.089  ❌
# 5m       2479   1267   1181       31    51.1%  -0.0982%    -0.114  ❌
# 15m      2492   1407   1035       50    56.5%  -0.0551%    -0.035  ⚠️
# 1h       3821   2303   1491       27    60.3%   0.1626%     0.065  ✅
# 4h       3794   2644   1111       39    69.7%   0.9078%     0.196  ✅
#
# ПРОБЛЕМА: 1m/5m имеют отрицательный PnL несмотря на ~51% WR
# ПРИЧИНА: SL слишком большой (-0.49% на 1m, -0.95% на 5m) vs TP1 (+0.35%, +0.69%)
# РЕШЕНИЕ: Уменьшить sl_pct для 1m/5m чтобы ограничить потери
# ───────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════
# V8: ФИНАЛЬНЫЙ ШТРИХ — микро-оптимизация для 5m/15m/1h
# ═══════════════════════════════════════════════════════════════════════════
#
# АНАЛИЗ V7:
#   - 15m: WR 60%, AvgPnL +0.007% ✅ ПРИБЫЛЬНЫЙ!
#   - 1h: WR 53.9%, AvgPnL +0.004% ⚠️ почти 0
#   - 5m: WR 51.5%, AvgPnL -0.060% ❌ нужно +5.5% WR или R:R лучше
#
# ПРОБЛЕМА: AvgPnL- всё ещё слишком большой (-0.74% to -2.16%)
# РЕШЕНИЕ: SL = 90% от V7 (ужим ещё на 10%, но не экстремально)
#          TP1 = 100% от V7 (оставляем)

# ───────────────────────────────────────────────────────────────────────────
# 1-MINUTE TIMEFRAME (отдельная стратегия)
# ───────────────────────────────────────────────────────────────────────────
[timeframe_1m]
tp1_pct = 0.21     # ← без изменений
tp2_pct = 0.42
tp3_pct = 0.72
sl_pct  = 0.39     # ↓ 90% от V7 (0.43%)
sl_min_pct = 0.19  # 90% от V7

# ───────────────────────────────────────────────────────────────────────────
# 5-MINUTE TIMEFRAME — КЛЮЧЕВОЙ TF #1
# ───────────────────────────────────────────────────────────────────────────
# V8: WR 62.9%, TP1=0.42%, SL=0.69%, R:R=0.61, AvgPnL=+0.0745%
# ENTRY AGENT V8: WR 63.6%, AvgPnL+=0.3719%, AvgPnL-=-0.4554%
#
# V9 (ТЕКУЩИЙ): Стратегия "дать дышать + ловить движение":
#   - SL ШИРЕ (0.69→0.80%) — меньше стопов на виках, цена дышит
#   - TP ШИРЕ (0.42→0.52%) — захватываем бо́льшее движение
#   - Entry Agent window=4 (20 мин) — входим рано или cancel
#   - В комбинации: WR↑ (меньше SL-хитов) и PnL↑ (шире TP при раннем входе)
[timeframe_5m]
tp1_pct = 0.52     # ↑ +24% (was 0.42) — ловим больше движения
tp2_pct = 1.05     # ↑ +25% (was 0.84)
tp3_pct = 1.70     # ↑ +21% (was 1.40)
sl_pct  = 0.80     # ↑ +16% (was 0.69) — даём цене дышать, меньше SL-хитов
sl_min_pct = 0.38  # ↑ (was 0.34) — минимальный SL тоже чуть шире

# ───────────────────────────────────────────────────────────────────────────
# 15-MINUTE TIMEFRAME — КЛЮЧЕВОЙ TF #2 (ПРИБЫЛЬНЫЙ!)
# ───────────────────────────────────────────────────────────────────────────
# V8: WR 61.9%, TP1=0.68%, SL=1.46%, R:R=0.47, AvgPnL=+0.0363%
# ENTRY AGENT V8: WR 62.6%, AvgPnL+=0.6461%, AvgPnL-=-0.9881%
#
# V9: SL шире чтобы не ловить стопы на коррекциях,
#     TP шире чтобы захватить бо́льший диапазон.
[timeframe_15m]
tp1_pct = 0.82     # ↑ +21% (was 0.68) — шире первый тейк
tp2_pct = 1.65     # ↑ +17% (was 1.41)
tp3_pct = 2.60     # ↑ +18% (was 2.20)
sl_pct  = 1.60     # ↑ +10% (was 1.46) — даём дышать
sl_min_pct = 0.75  # ↑ (was 0.69) — минимальный SL шире

# ───────────────────────────────────────────────────────────────────────────
# 1-HOUR TIMEFRAME — КЛЮЧЕВОЙ TF #3
# ───────────────────────────────────────────────────────────────────────────
# V7: WR 53.9%, TP1=1.06%, SL=2.38%, R:R=0.45, AvgPnL=+0.004%
# V8: Цель WR 52%+, R:R 0.48+, AvgPnL +0.02% → +0.05%
[timeframe_1h]
tp1_pct = 1.06     # ← без изменений
tp2_pct = 1.98     # без изменений
tp3_pct = 2.95     # без изменений
sl_pct  = 2.14     # ↓ 90% от V7 (2.38%) - чуть tighter
sl_min_pct = 1.07  # 90% от V7

# ───────────────────────────────────────────────────────────────────────────
# 4-HOUR TIMEFRAME (отдельная стратегия)
# ───────────────────────────────────────────────────────────────────────────
[timeframe_4h]
tp1_pct = 1.92
tp2_pct = 3.53
tp3_pct = 5.02
sl_pct  = 4.28     # ↓ 90% от V7 (4.76%)
sl_min_pct = 2.14  # 90% от V7

# ───────────────────────────────────────────────────────────────────────────
# DAILY TIMEFRAME (отдельная стратегия)
# ───────────────────────────────────────────────────────────────────────────
[timeframe_1d]
tp1_pct = 2.34
tp2_pct = 4.35
tp3_pct = 6.3
sl_pct  = 6.43     # ↓ 90% от V7 (7.14%)
sl_min_pct = 3.21  # 90% от V7

# ───────────────────────────────────────────────────────────────────────────
# ATR МНОЖИТЕЛИ ДЛЯ BOUNCE SETUP (когда цена у уровня)
# ───────────────────────────────────────────────────────────────────────────
# Используются когда сигнал около support/resistance
[atr_bounce]
sl_mult  = 0.75    # SL = level ± (ATR × 0.55)
tp1_mult = 1.1    # TP1 = entry ± (ATR × 0.75)
tp2_mult = 1.6     # TP2 = entry ± (ATR × 1.4)
tp3_mult = 2.5     # TP3 = entry ± (ATR × 2.2)

# ───────────────────────────────────────────────────────────────────────────
# ATR МНОЖИТЕЛИ ДЛЯ BREAKOUT SETUP (когда пробой уровня)
# ───────────────────────────────────────────────────────────────────────────
# Используются когда сигнал пробой support/resistance
[atr_breakout]
sl_mult  = 0.75    # SL = level ± (ATR × 0.75)
tp1_mult = 1.1     # TP1 = entry ± (ATR × 1.1)
tp2_mult = 1.6     # TP2 = entry ± (ATR × 1.8)
tp3_mult = 2.5     # TP3 = entry ± (ATR × 2.8)

# ───────────────────────────────────────────────────────────────────────────
# ДОПОЛНИТЕЛЬНЫЕ ПАРАМЕТРЫ
# ───────────────────────────────────────────────────────────────────────────
[other]
tp2_ratio_min = 1.6      # TP2 должен быть ≥ TP1 × 1.6
tp3_ratio_min = 1.45     # TP3 должен быть ≥ TP2 × 1.45
min_tp_gap_pct = 0.2     # Минимальный зазор между TP = 0.2%
fallback_atr_pct = 0.8   # Если ATR недоступен, использовать 0.8% от entry
