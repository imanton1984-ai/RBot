# ═══════════════════════════════════════════════════════════════════════════
# GLOBAL TP/SL PARAMETERS FOR TRADE SIGNALS
# ═══════════════════════════════════════════════════════════════════════════
#
# 📊 КАЛИБРОВКА ПАРАМЕТРОВ:
# 1. Измени значения ниже
# 2. Запусти backtester: cargo run --package backtester
# 3. Сравни результаты (WinRate, AvgPnL, Sharpe)
# 4. Повторяй пока не найдёшь оптимум
#
# 📝 ВСЕ ЗНАЧЕНИЯ В ПРОЦЕНТАХ:
#    tp1_pct = 0.3  →  TP1 = entry + 0.3%
#    sl_pct  = 0.4  →  SL  = entry - 0.4%
#
# ───────────────────────────────────────────────────────────────────────────
# ТЕКУЩИЕ РЕЗУЛЬТАТЫ БЕКТЕСТА (до калибровки):
# ───────────────────────────────────────────────────────────────────────────
# TF      Total   Wins   Loss    Exprd  WinRate   AvgPnL     Sharpe
# 1m       1754    908    805       41    51.8%  -0.0410%    -0.089  ❌
# 5m       2479   1267   1181       31    51.1%  -0.0982%    -0.114  ❌
# 15m      2492   1407   1035       50    56.5%  -0.0551%    -0.035  ⚠️
# 1h       3821   2303   1491       27    60.3%   0.1626%     0.065  ✅
# 4h       3794   2644   1111       39    69.7%   0.9078%     0.196  ✅
#
# ПРОБЛЕМА: 1m/5m имеют отрицательный PnL несмотря на ~51% WR
# ПРИЧИНА: SL слишком большой (-0.49% на 1m, -0.95% на 5m) vs TP1 (+0.35%, +0.69%)
# РЕШЕНИЕ: Уменьшить sl_pct для 1m/5m чтобы ограничить потери
# ───────────────────────────────────────────────────────────────────────────

# ───────────────────────────────────────────────────────────────────────────
# 1-MINUTE TIMEFRAME
# ───────────────────────────────────────────────────────────────────────────
# v2: УМЕНЬШЕНЫ TP1/TP2/TP3 для роста WR (было 42.4% → цель 55%+)
# SL уменьшён для контроля потерь
[timeframe_1m]
tp1_pct = 0.22     # ↓ ↓ ↓ TP1 = 0.22% (было 0.35%) - ЛЕГЧЕ ПОПАСТЬ!
tp2_pct = 0.45     # ↓ TP2 = 0.45% (было 0.7%)
tp3_pct = 0.8      # ↓ TP3 = 0.8% (было 1.2%)
sl_pct  = 0.35     # ↓ SL  = 0.35% (было 0.5%) - меньше потери
sl_min_pct = 0.18  # ↓ SL минимум

# ───────────────────────────────────────────────────────────────────────────
# 5-MINUTE TIMEFRAME
# ───────────────────────────────────────────────────────────────────────────
# v2: УМЕНЬШЕНЫ TP1/TP2/TP3 для роста WR (было 49.2% → цель 58%+)
# SL уменьшён для контроля потерь
[timeframe_5m]
tp1_pct = 0.45     # ↓ ↓ ↓ TP1 = 0.45% (было 0.7%) - ЛЕГЧЕ ПОПАСТЬ!
tp2_pct = 0.9      # ↓ TP2 = 0.9% (было 1.4%)
tp3_pct = 1.5      # ↓ TP3 = 1.5% (было 2.3%)
sl_pct  = 0.65     # ↓ SL  = 0.65% (было 0.95%) - меньше потери
sl_min_pct = 0.35  # ↓ SL минимум

# ───────────────────────────────────────────────────────────────────────────
# 15-MINUTE TIMEFRAME
# ───────────────────────────────────────────────────────────────────────────
# v2: УМЕНЬШЕНЫ TP1/TP2/TP3 для роста WR (было 54.1% → цель 60%+)
# SL немного уменьшён, TP1 значительно легче
[timeframe_15m]
tp1_pct = 0.75     # ↓ ↓ ↓ TP1 = 0.75% (было 1.15%) - ЛЕГЧЕ ПОПАСТЬ!
tp2_pct = 1.5      # ↓ TP2 = 1.5% (было 2.3%)
tp3_pct = 2.4      # ↓ TP3 = 2.4% (было 3.5%)
sl_pct  = 1.3      # ↓ SL  = 1.3% (было 1.75%)
sl_min_pct = 0.6   # ↓ SL минимум

# ───────────────────────────────────────────────────────────────────────────
# 1-HOUR TIMEFRAME
# ───────────────────────────────────────────────────────────────────────────
# v2: УМЕНЬШЕНЫ TP1/TP2/TP3 для роста WR (было 57.2% → цель 63%+)
# SL немного уменьшён
[timeframe_1h]
tp1_pct = 1.2      # ↓ ↓ ↓ TP1 = 1.2% (было 1.7%) - ЛЕГЧЕ ПОПАСТЬ!
tp2_pct = 2.2      # ↓ TP2 = 2.2% (было 3.2%)
tp3_pct = 3.4      # ↓ TP3 = 3.4% (было 4.6%)
sl_pct  = 2.0      # ↓ SL  = 2.0% (было 2.9%)
sl_min_pct = 0.9   # ↓ SL минимум

# ───────────────────────────────────────────────────────────────────────────
# 4-HOUR TIMEFRAME
# ───────────────────────────────────────────────────────────────────────────
# v2: УМЕНЬШЕНЫ TP1/TP2/TP3 для роста WR (было 66.8% → цель 72%+)
# 4h лучший TF - сохраняем хороший R:R
[timeframe_4h]
tp1_pct = 2.0      # ↓ ↓ ↓ TP1 = 2.0% (было 2.8%) - ЛЕГЧЕ ПОПАСТЬ!
tp2_pct = 3.6      # ↓ TP2 = 3.6% (было 5.0%)
tp3_pct = 5.2      # ↓ TP3 = 5.2% (было 7.2%)
sl_pct  = 4.0      # ↓ SL  = 4.0% (было 5.6%) - контроль потерь
sl_min_pct = 1.3   # ↓ SL минимум

# ───────────────────────────────────────────────────────────────────────────
# DAILY TIMEFRAME
# ───────────────────────────────────────────────────────────────────────────
# v2: УМЕНЬШЕНЫ TP1/TP2/TP3 для роста WR
[timeframe_1d]
tp1_pct = 2.4      # ↓ ↓ ↓ TP1 = 2.4% (было 3.4%)
tp2_pct = 4.4      # ↓ TP2 = 4.4% (было 6.2%)
tp3_pct = 6.5      # ↓ TP3 = 6.5% (было 9.0%)
sl_pct  = 5.5      # ↓ SL  = 5.5% (было 7.8%)
sl_min_pct = 1.8   # ↓ SL минимум

# ───────────────────────────────────────────────────────────────────────────
# ATR МНОЖИТЕЛИ ДЛЯ BOUNCE SETUP (когда цена у уровня)
# ───────────────────────────────────────────────────────────────────────────
# Используются когда сигнал около support/resistance
[atr_bounce]
sl_mult  = 0.55    # SL = level ± (ATR × 0.55)
tp1_mult = 0.75    # TP1 = entry ± (ATR × 0.75)
tp2_mult = 1.4     # TP2 = entry ± (ATR × 1.4)
tp3_mult = 2.2     # TP3 = entry ± (ATR × 2.2)

# ───────────────────────────────────────────────────────────────────────────
# ATR МНОЖИТЕЛИ ДЛЯ BREAKOUT SETUP (когда пробой уровня)
# ───────────────────────────────────────────────────────────────────────────
# Используются когда сигнал пробой support/resistance
[atr_breakout]
sl_mult  = 0.75    # SL = level ± (ATR × 0.75)
tp1_mult = 1.1     # TP1 = entry ± (ATR × 1.1)
tp2_mult = 1.8     # TP2 = entry ± (ATR × 1.8)
tp3_mult = 2.8     # TP3 = entry ± (ATR × 2.8)

# ───────────────────────────────────────────────────────────────────────────
# ДОПОЛНИТЕЛЬНЫЕ ПАРАМЕТРЫ
# ───────────────────────────────────────────────────────────────────────────
[other]
tp2_ratio_min = 1.6      # TP2 должен быть ≥ TP1 × 1.6
tp3_ratio_min = 1.45     # TP3 должен быть ≥ TP2 × 1.45
min_tp_gap_pct = 0.2     # Минимальный зазор между TP = 0.2%
fallback_atr_pct = 0.8   # Если ATR недоступен, использовать 0.8% от entry
