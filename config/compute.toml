[compute]
gpu_enabled = true
gpu_preferred = true
cpu_enabled = true
realtime_default_backend = "cpu"
backfill_default_backend = "gpu"
gpu_catchup_backlog_candles = 2500
gpu_catchup_max_latency_ms = 900
gpu_batch_symbols = 48
gpu_batch_timeframes = 6
gpu_streams = 2
hot_window_candles = 1200
hot_indicator_window = 1200

[compute.indicators]
rsi = true
macd = true
ema_20 = true
ema_50 = true
ema_200 = true
sma = true
bollinger = true
stoch = true
atr = true
adx = true
vwap = true
obv = true
cci = true
williams = true
alligator = true
trend = true
volume_spike = true
sr_levels = true

[compute.raw_signals]
min_indicator_score = 0.60
min_publish_score = 0.80

[compute.final_signals]
# With corrected scoring formula (softer coverage/consensus penalties),
# 0.55 lets strong heuristic-only signals through.
# Increase to 0.70+ once ML models are trained and loaded.
min_final_score = 0.55

[compute.predictors]
enabled = true
horizon_bars = 10
min_store_score = 0.50
min_final_score = 0.55
prefer_ml = true
max_levels_per_side = 2
use_cuda = true
# Пути к моделям
model_path_price  = "models/price_v1_tf{tf}.ubj"
model_path_levels = "models/levels_v1_tf{tf}.ubj"