[workspace]
members = [
  "common",
  "connections",      # <-- единый модуль подключений
  "database",
  "healthcheck",
  "ingestor",         # <-- единый модуль получения и записи данных
  "compute",          # <-- модуль вычислений индикаторов
  "cuda",             # <-- модуль CUDA вычислений
  "compute/predictors", # <-- модуль предсказаний
  "orderflow",        # <-- модуль order flow метрик
  "backtester",       # <-- бэктестер для оценки сигналов
  "strategies/ml_entry_strategy", # <-- ML Entry Strategy (Super Entry)
  "strategies/ewmac_strategy",   # <-- EWMAC Strategy (Trend-Following)
  "strategies/level_strategy",    # <-- Level Strategy (базовая стратегия)
  "strategies/super_level_strategy", # <-- Super Level Strategy (Level-First Sniper)
  "strategies/ml_pump_dump",          # <-- ML Pump/Dump Detection Strategy (standalone)
  "settings",                     # <-- Настройки ордеров и биржи
  "risk_manager",                 # <-- Risk Manager (мониторинг рисков)
  "order_manager",                # <-- Order Manager (ордера, позиции, PnL)
  "webui",                        # <-- WebUI сервер
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }


url = "2"
bytes = "1.0"
futures = "0.3"
chrono = "0.4"

config = "0.15.19"

axum = "0.8.8"
tower-http = "0.6"

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
uuid = "1"

rdkafka = { version = "0.39.0", default-features = false, features = ["ssl", "sasl", "tokio"] }

tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-stream = "0.1"

dotenvy = "0.15"


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"