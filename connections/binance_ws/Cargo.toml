[package]
name = "binance_ws"
version = "0.1.0"
edition = "2021"

[lib]
name = "binance_ws"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
tungstenite = "0.20"
url = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
futures-util = "0.3"
