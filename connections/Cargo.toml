# connections/Cargo.toml

[package]
name = "connections"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "connections"

[[bin]]
name = "conncheck"
path = "src/bin/conncheck.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }

# REST
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

# WS
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
futures-util = { workspace = true }
itertools = { workspace = true }

# DB
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Kafka/Redpanda
rdkafka = { workspace = true, features = ["tokio"] }

common = { path = "../common" }

