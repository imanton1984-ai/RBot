[package]
name = "market_data"
version = "0.1.0"
edition = "2021"

[lib]
name = "market_data"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rdkafka = { version = "0.36", features = ["cmake-build"] }
thiserror = "1.0"
