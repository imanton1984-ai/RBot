[package]
name = "backtester"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backtester"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Local deps for shared types
common = { path = "../common" }
predictors = { path = "../compute/predictors" }
