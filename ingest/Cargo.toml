[package]
name = "ingest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
common = { path = "../crates/common" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Keep tokio-postgres if used elsewhere, but universe.rs needs sqlx
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-serde_json-1"] }
# ADD THESE TWO LINES:
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
toml = "0.8"

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

