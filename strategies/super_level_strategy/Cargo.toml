[package]
name = "super_level_strategy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "super_level_backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "super_level_dataset"
path = "src/bin/dataset_builder.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }

# Local crates — reuse data layer and ML runtime
common = { path = "../../common" }
predictors = { path = "../../compute/predictors" }
ml_entry_strategy = { path = "../ml_entry_strategy" }
indicators = { package = "compute_indicators", path = "../../compute/indicators" }

# Extra
csv = "1.3"
