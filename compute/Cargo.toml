[package]
name = "compute"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "compute"
path = "src/main.rs"

[lib]
name = "compute_lib"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
common = { path = "../common" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
compute_indicators = { path = "./indicators" }
raw_signals = { path = "./raw_signals" }
cuda = { path = "../cuda", optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
connections = { path = "../connections" }
rdkafka = { version = "0.39.0", features = ["tokio"] }

[features]
default = []
cuda = ["dep:cuda"]
