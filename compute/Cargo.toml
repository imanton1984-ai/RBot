[package]
name = "compute"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "compute"
path = "src/main.rs"

[[bin]]
name = "compute_history"
path = "src/bin/compute_history.rs"

[[bin]]
name = "compute_realtime"
path = "src/bin/compute_realtime.rs"

[lib]
name = "compute_lib"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
common = { path = "../common" }
database_lib = { package = "database", path = "../database" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
compute_indicators = { path = "./indicators" }
raw_signals = { path = "./raw_signals" }
predictors = { path = "./predictors" }
cuda = { path = "../cuda", optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
connections_lib = { package = "connections", path = "../connections" }
rdkafka = { version = "0.39.0", features = ["tokio"] }
dotenvy = "0.15"
futures-util = "0.3"
tokio-stream = "0.1"
ndarray = "0.16"
tracing-appender = "0.2"
dashmap = "5.5"
cudarc = { version = "0.11.2", optional = true, features = ["f16", "cuda-12050"] }
config = "0.15"
ml_entry_strategy = { path = "../strategies/ml_entry_strategy" }

[features]
default = []
cuda = ["dep:cuda", "dep:cudarc", "predictors/cuda"]
