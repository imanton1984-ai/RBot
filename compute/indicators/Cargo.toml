[package]
name = "compute_indicators"
version = "0.1.0"
edition = "2021"

[lib]
name = "compute_indicators"
path = "lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
common = { path = "../../common" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }