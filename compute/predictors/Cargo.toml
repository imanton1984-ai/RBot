[package]
name = "predictors"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
common = { path = "../../common" }
compute_indicators = { path = "../indicators" }
database_lib = { package = "database", path = "../../database" }
chrono = { version = "0.4", features = ["serde"] }
ndarray = "0.16"
ort = { version = "2.0.0-rc.11", features = ["cuda"] }
dashmap = "5.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
cudarc = "0.11.0"