[package]
name = "predictors"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
cuda = ["dep:cudarc"]   # needed only for real zero-copy via cuda array interface

[[example]]
name = "entry_agent_example"
path = "examples/entry_agent_example.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
common = { path = "../../common" }
compute_indicators = { path = "../indicators" }
database_lib = { package = "database", path = "../../database" }
chrono = { version = "0.4", features = ["serde"] }
ndarray = "0.16"
dashmap = "5.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
cudarc = { version = "0.11.2", optional = true, features = ["driver"] }
futures = "0.3"

# Remove ort dependency as we're using XGBoost directly
# ort = { version = "2.0.0-rc.11", features = ["cuda"] }